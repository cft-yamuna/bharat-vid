<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bharat Connect — Choose a Category</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Bharat Connect — category launcher
   The menu is the supplied 1080 x 1920 artwork (new.png) drawn at its
   native size, with transparent hit targets over the 10 tiles.
   The stage is authored at 1080 x 1920 and scaled to fit the viewport.
   ============================================================ */
:root{
  --navy:#20457B;        /* headline navy, sampled from the artwork */
  --muted:#4D6A95;       /* "POWERED BY" grey-blue */
  --bc-blue:#185EB2;     /* Bharat Connect mark */
  --bc-orange:#FD5F00;   /* Bharat Connect wordmark */
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0d10;overflow:hidden}
body{
  font-family:"DM Sans","Google Sans","Product Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  position:relative;
}

/* ---------- 1080 x 1920 stage ---------- */
#stage{
  /* Anchored to the viewport centre and scaled about its own centre.
     The layout box stays 1080x1920 at every viewport size. */
  position:absolute;left:50%;top:50%;
  width:1080px;height:1920px;overflow:hidden;
  transform-origin:center center;
  background:#EDF3FC;
}

/* ---------- the artwork, 1:1 ---------- */
#plate{
  position:absolute;left:0;top:0;width:1080px;height:1920px;
  display:block;user-select:none;-webkit-user-drag:none;pointer-events:none;
}

/* ---------- tile hit targets over the artwork ---------- */
#tiles{position:absolute;inset:0}
.tile{
  position:absolute;
  background:none;border:0;padding:0;margin:0;cursor:pointer;
  font:inherit;color:transparent;border-radius:30px;
  transition:transform .16s ease, background-color .16s ease, box-shadow .16s ease;
}
.tile:hover{background:rgba(24,94,178,.07)}
.tile:active{
  transform:scale(.955);
  background:rgba(24,94,178,.13);
  box-shadow:0 0 0 1.5px rgba(24,94,178,.22) inset;
}
.tile:focus-visible{outline:3px solid rgba(24,94,178,.6);outline-offset:2px}

/* ---------- video player overlay ---------- */
#player{position:absolute;inset:0;display:none;z-index:20;background:transparent}
#player.on{display:block}
#player video{
  width:1080px;height:1920px;object-fit:cover;display:block;background:#000;
  opacity:0;transition:opacity .3s ease;
}
#player.playing video{opacity:1}

/* the one control on the player: bottom-right, dark glass over video,
   flipped to a light treatment on the branded surface. Esc works too. */
#exit{
  position:absolute;right:52px;bottom:58px;
  display:flex;align-items:center;gap:16px;
  height:94px;padding:0 42px 0 32px;
  margin:0;border:0;border-radius:47px;cursor:pointer;
  -webkit-appearance:none;appearance:none;
  background:rgba(12,14,18,.55);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:0 0 0 1.5px rgba(255,255,255,.26) inset, 0 12px 32px -14px rgba(0,0,0,.7);
  color:#fff;font:inherit;font-size:31px;font-weight:500;letter-spacing:.2px;
  transition:transform .14s ease, background-color .18s ease;
}
#exit svg{display:block}
#exit:active{transform:scale(.955);background:rgba(12,14,18,.74)}

/* ---------- branded loading surface ----------
   It paints no background of its own: it frosts whatever is behind it,
   which is the artwork itself (the video is still at opacity 0 while
   booting). The menu -> loader -> video hand-off is seamless by
   construction, with no second copy of the gradient to keep in sync. */
#loader{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-bottom:56px;
  background:rgba(255,255,255,.76);
  -webkit-backdrop-filter:blur(26px) saturate(1.06);
  backdrop-filter:blur(26px) saturate(1.06);
  opacity:0;visibility:hidden;
  transition:opacity .34s ease, visibility 0s linear .34s;
}
#player.booting #loader,
#player.failed  #loader{
  opacity:1;visibility:visible;
  transition:opacity .18s ease;
}

#ldLogo{
  display:block;width:290px;height:auto;
  animation:breathe 2.4s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{transform:scale(1);opacity:1}
  50%    {transform:scale(1.035);opacity:.88}
}

#ldName{
  margin-top:52px;
  font-size:38px;font-weight:500;letter-spacing:.2px;color:var(--navy);
}

#ldBar{
  margin-top:44px;width:320px;height:9px;border-radius:5px;overflow:hidden;
  background:rgba(24,94,178,.15);
}
#ldBar i{
  display:block;width:38%;height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--bc-blue),var(--bc-orange));
  animation:sweep 1.35s cubic-bezier(.62,.02,.35,1) infinite;
}
@keyframes sweep{
  0%  {transform:translateX(-100%)}
  100%{transform:translateX(263%)}
}
#player.failed #ldBar,
#player.needstap #ldBar{display:none}

#ldTap{
  display:none;margin-top:40px;align-items:center;gap:20px;
  padding:0 34px 0 22px;height:88px;border:0;border-radius:44px;cursor:pointer;
  font:inherit;font-size:30px;font-weight:500;letter-spacing:.2px;color:#fff;
  background:var(--bc-blue);
  box-shadow:0 10px 26px -10px rgba(24,94,178,.75);
}
#ldTap svg{display:block}
#player.needstap #ldTap{display:flex}

/* mid-playback buffering: a small ring over the video, never the full surface */
#buf{
  position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;
  border:5px solid rgba(255,255,255,.26);border-top-color:var(--bc-orange);
  border-radius:50%;animation:sp .95s linear infinite;
  opacity:0;transition:opacity .2s ease;
}
#player.loading:not(.booting) #buf{opacity:1}
@keyframes sp{to{transform:rotate(360deg)}}

#err{
  display:none;text-align:center;color:var(--navy);
  margin-top:44px;max-width:820px;
}
#player.failed #err{display:block}
#err h2{font-size:40px;font-weight:700;margin-bottom:16px}
#err p{
  font-size:23px;line-height:34px;color:var(--muted);word-break:break-all;
  font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;
}

#player.booting #exit,
#player.failed  #exit{
  background:rgba(255,255,255,.88);
  -webkit-backdrop-filter:none;backdrop-filter:none;
  box-shadow:0 0 0 1.5px rgba(24,94,178,.22) inset, 0 12px 30px -14px rgba(28,52,96,.5);
  color:var(--navy);
}
#player.booting #exit svg,
#player.failed  #exit svg{stroke:#20457B}
</style>
</head>
<body>

<div id="stage">

  <!-- the supplied artwork at its native 1080 x 1920 -->
  <img id="plate" src="new.png" alt="Bharat Connect — choose a category to explore the flow" draggable="false">

  <!-- transparent hit targets, positioned over the 10 tiles -->
  <div id="tiles" role="list"></div>

  <!-- ================= video player ================= -->
  <div id="player" aria-hidden="true">
    <video id="vid" playsinline preload="none"></video>

    <div id="loader">
      <img id="ldLogo" src="bc-lockup.png" alt="Bharat Connect">
      <div id="ldName"></div>
      <div id="ldBar"><i></i></div>
      <button id="ldTap" type="button">
        <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
          <circle cx="22" cy="22" r="20" fill="none" stroke="#fff" stroke-width="2.6" opacity=".55"/>
          <path d="M18 14.6 30.4 22 18 29.4Z" fill="#fff"/>
        </svg>
        Tap to play
      </button>
      <div id="err"><h2>Video unavailable</h2><p id="errU"></p></div>
    </div>

    <div id="buf"></div>
    <button id="exit" type="button">
      <svg width="20" height="32" viewBox="0 0 20 34" fill="none" stroke="#fff"
           stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2 4 17l12 15"/></svg>
      Back
    </button>
  </div>

</div>

<script>
/* ============================================================
   CONFIG — local video files
   Videos are served from the bh_videos/ folder next to index.html,
   so the app runs fully offline. No network round trip needed.
   ============================================================ */
const FOLDER = "bh_videos";

/* ---- tile geometry, measured off new.png at 1080 x 1920 ----
   Three columns pitched 200px apart, centred on the phone screen
   (x 233..859); four rows band-fitted to the icon + label clusters. */
const COLX   = [246, 446, 646];      /* left edge of each column */
const TILE_W = 200;
const ROWY   = [                     /* [top, height] per row */
  [ 572, 234],
  [ 806, 224],
  [1030, 195],
  [1225, 209]
];

/* ---- category -> video object in bh_videos/ ----
   Order matches the artwork, left to right, top to bottom. */
const CATEGORIES = [
  { id:"education",   label:"Education Fees",  file:"education.mp4"   },
  { id:"electricity", label:"Electricity",     file:"electricity.mp4" },
  { id:"echallan",    label:"E-challan",       file:"e-challan.mp4"   },
  { id:"loan",        label:"Loan repayment",  file:"loan.mp4"        },
  { id:"fastag",      label:"FASTag",          file:"fastag.mp4"      },
  { id:"lpg",         label:"LPG",             file:"lpg.mp4"         },
  { id:"nps",         label:"NPS",             file:"ncmc.mp4"        },
  { id:"pipedgas",    label:"Piped gas",       file:"piped-gas.mp4"   },
  { id:"ev",          label:"EV Recharge",     file:"ev-recharge.mp4" },
  { id:"forex",       label:"Forex",           file:"forex.mp4"       },
  { id:"tourism",     label:"Tourism",         file:"Tourism.mp4"     },
  { id:"transit",     label:"Transit",         file:"Transit.mp4"     }
];

const localUrl = f => FOLDER + "/" + encodeURIComponent(f);
</script>

<script>
/* ============================================================
   BUILD THE HIT TARGETS
   ============================================================ */
const tiles = document.getElementById("tiles");

CATEGORIES.forEach(function(c, i){
  const row = ROWY[Math.floor(i / 3)];
  const x   = COLX[i % 3];

  const b = document.createElement("button");
  b.type = "button";
  b.className = "tile";
  b.setAttribute("role","listitem");
  b.setAttribute("aria-label", c.label);
  b.dataset.file = c.file;
  b.style.left   = (x + 6) + "px";
  b.style.top    = (row[0] + 6) + "px";
  b.style.width  = (TILE_W - 12) + "px";
  b.style.height = (row[1] - 12) + "px";
  b.addEventListener("click", function(){ play(c); });
  tiles.appendChild(b);
});

/* ============================================================
   PLAYER
   ============================================================ */
const player = document.getElementById("player");
const vid    = document.getElementById("vid");
const errU   = document.getElementById("errU");
const ldName = document.getElementById("ldName");

function play(c){
  player.classList.add("on","booting","loading");
  player.classList.remove("failed","needstap","playing");
  player.setAttribute("aria-hidden","false");
  ldName.textContent = c.label;

  errU.textContent = FOLDER + "/" + c.file;

  start(localUrl(c.file));
}

function start(url){
  vid.src = url;
  vid.currentTime = 0;
  var pr = vid.play();
  if(pr && pr.catch) pr.catch(function(e){
    /* Blocked autoplay is not a broken video - offer a tap instead.
       Genuine load failures arrive on the element's own "error" event. */
    if(e && e.name === "NotAllowedError"){
      if(!player.classList.contains("failed")) player.classList.add("needstap");
    }
  });
}

function fail(file, msg){
  player.classList.remove("loading","booting","needstap","playing");
  player.classList.add("failed");
  errU.textContent = FOLDER + "/" + file + (msg ? " — " + msg : "");
}

function stop(){
  vid.pause();
  vid.removeAttribute("src");
  vid.load();
  player.classList.remove("on","booting","loading","failed","needstap","playing");
  player.setAttribute("aria-hidden","true");
}

vid.addEventListener("playing", function(){
  player.classList.remove("loading","booting","needstap");
  player.classList.add("playing");
});
vid.addEventListener("waiting", function(){ player.classList.add("loading"); });
vid.addEventListener("error",   function(){
  if(vid.getAttribute("src")) fail(decodeURIComponent(vid.src.split("/").pop()), "load error");
});
vid.addEventListener("ended", stop);

document.getElementById("ldTap").addEventListener("click", function(e){
  e.stopPropagation();
  player.classList.remove("needstap");
  vid.play().catch(function(){ player.classList.add("needstap"); });
});
document.getElementById("exit").addEventListener("click", stop);
player.addEventListener("pointerdown", function(e){
  if(e.target.closest("#exit") || e.target.closest("#ldTap")) return;
  /* the error surface carries no visible control, so any tap on it exits */
  if(player.classList.contains("failed")){ stop(); return; }
  if(vid.paused && vid.getAttribute("src")) vid.play().catch(function(){});
});
addEventListener("keydown", function(e){
  if(e.key === "Escape" || e.key === "Backspace") stop();
});

/* ============================================================
   FIT THE 1080x1920 STAGE TO THE VIEWPORT
   ============================================================ */
const stage = document.getElementById("stage");
function fit(){
  const s = Math.min(innerWidth / 1080, innerHeight / 1920);
  stage.style.transform = "translate(-50%,-50%) scale(" + s + ")";
}
addEventListener("resize", fit);
addEventListener("orientationchange", fit);
fit();
</script>
</body>
</html>
