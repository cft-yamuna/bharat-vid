<style>
/* ============================================================
   Bharat Connect — category launcher
   Authored at exactly 1080 x 1920, then scaled to fit the viewport.
   ============================================================ */
:root{
  --navy:#22406E;
  --label:#1F2124;
  --muted:#5D6C86;
  --bc-blue:#1B54A8;
  --bc-orange:#E8562E;
  --sky:
    radial-gradient(78% 34% at 62% 40%, rgba(108,158,234,.72) 0%, rgba(142,185,244,.34) 52%, rgba(255,255,255,0) 78%),
    radial-gradient(70% 30% at 34% 33%, rgba(120,166,236,.62) 0%, rgba(255,255,255,0) 74%),
    linear-gradient(180deg,
      #FFFFFF 0%,   #FDFDFE 6%,  #F4F9FD 14%, #E4EDFB 21%,
      #C2D8F7 27%,  #A6C4F1 33%, #96B9EF 38%, #9CBDF1 43%,
      #B2CFF6 49%,  #BFD7F9 56%, #D2E2FC 63%, #D9E8FD 70%,
      #E3EEFD 77%,  #EFF6FF 85%, #FBFCFE 91%, #FFFFFF 96%);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0d10;overflow:hidden}
body{
  font-family:"DM Sans","Google Sans","Product Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  position:relative;
}

/* ---------- 1080 x 1920 stage ---------- */
#stage{
  /* Anchored to the viewport centre and scaled about its own centre.
     The layout box stays 1080x1920 at every viewport size. */
  position:absolute;left:50%;top:50%;
  width:1080px;height:1920px;overflow:hidden;
  transform-origin:center center;
  background:var(--sky);
}

/* ---------- headline ---------- */
#title{
  position:absolute;left:0;right:0;top:153px;text-align:center;
  font-size:60px;line-height:77px;font-weight:700;letter-spacing:-.4px;
  color:var(--navy);
}

/* ---------- phone mock ---------- */
#phone{
  position:absolute;left:50%;top:349px;margin-left:-335px;
  width:670px;height:1291px;
  border-radius:92px;padding:36px;
  background:linear-gradient(148deg,#3a3d45 0%,#16181d 16%,#101216 50%,#191c22 84%,#41444c 100%);
  box-shadow:
    0 2px 0 rgba(255,255,255,.16) inset,
    0 40px 70px -24px rgba(28,52,96,.42),
    0 10px 26px -10px rgba(28,52,96,.28);
}
#phone::before,#phone::after{
  content:"";position:absolute;right:-4px;width:5px;border-radius:0 4px 4px 0;
  background:linear-gradient(180deg,#2a2d34,#0e1014);
}
#phone::before{top:352px;height:64px}
#phone::after{top:436px;height:112px}
#volume{position:absolute;left:-4px;top:300px;width:5px;height:52px;border-radius:4px 0 0 4px;background:linear-gradient(180deg,#2a2d34,#0e1014)}
#volume::after{content:"";position:absolute;left:0;top:76px;width:5px;height:96px;border-radius:4px 0 0 4px;background:linear-gradient(180deg,#2a2d34,#0e1014)}

#screen{
  position:relative;width:100%;height:100%;
  border-radius:60px;background:#FFFFFF;overflow:hidden;
  display:flex;flex-direction:column;
}

/* ---------- status bar ---------- */
#status{
  position:relative;flex:none;height:96px;
  display:flex;align-items:center;justify-content:space-between;padding:0 46px;
  font-size:27px;font-weight:700;color:#0d0f12;letter-spacing:.2px;
}
#island{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);
  width:182px;height:46px;border-radius:23px;background:#0a0b0d;
  display:flex;align-items:center;justify-content:flex-end;padding-right:14px;
}
#island i{width:11px;height:11px;border-radius:50%;background:#15202e;display:block}
#statusR{display:flex;align-items:center;gap:9px}

/* ---------- app header ---------- */
#header{
  flex:none;height:104px;
  display:flex;align-items:center;gap:24px;padding:0 37px 0 16px;
}
#back{flex:none;display:grid;place-items:center;width:34px;height:34px;background:none;border:0;cursor:pointer}
#header h1{font-size:22px;font-weight:500;color:#16181b;letter-spacing:.1px}
#header .spacer{flex:1}
#kebab{flex:none;display:flex;flex-direction:column;gap:5px;align-items:center;padding-left:6px}
#kebab span{width:6px;height:6px;border-radius:50%;background:#111}

.bc{display:flex;align-items:center;gap:7px}
.bc svg{flex:none;display:block}
.bc .wm{font-weight:700;color:var(--bc-orange);line-height:1.04;letter-spacing:-.2px}

/* ---------- category grid ---------- */
#grid{
  flex:1;display:grid;grid-template-columns:repeat(3,1fr);
  align-content:start;row-gap:52px;padding:48px 12px 0;
}
.tile{
  display:flex;flex-direction:column;align-items:center;
  background:none;border:0;padding:10px 4px;cursor:pointer;
  font:inherit;color:inherit;border-radius:24px;
  transition:transform .16s ease, background-color .16s ease;
}
.tile .ic{width:72px;height:72px;display:grid;place-items:center;margin-bottom:20px}
.tile .ic svg{width:72px;height:72px;display:block;overflow:visible}
.tile .tx{
  font-size:23px;line-height:24px;font-weight:400;color:var(--label);
  letter-spacing:.1px;text-align:center;
}
.tile:hover{background:rgba(26,80,208,.055)}
.tile:active{transform:scale(.94);background:rgba(26,80,208,.10)}
.tile:focus-visible{outline:3px solid rgba(26,80,208,.55);outline-offset:2px}

/* ---------- android nav ---------- */
#nav{flex:none;height:112px;display:flex;align-items:center;justify-content:center;gap:118px}
#nav .t{width:0;height:0;border-top:11px solid transparent;border-bottom:11px solid transparent;border-right:15px solid #101215}
#nav .c{width:25px;height:25px;border-radius:50%;background:#101215}
#nav .s{width:19px;height:19px;border-radius:3px;background:#101215}

/* ---------- footer ---------- */
#footer{
  position:absolute;left:0;right:0;top:1729px;
  display:flex;align-items:center;justify-content:center;gap:40px;
}
#footer .pb{font-size:36px;font-weight:700;letter-spacing:3.9px;color:var(--muted)}

/* ---------- video player overlay ---------- */
#player{position:absolute;inset:0;background:#000;display:none;z-index:20}
#player.on{display:block}
#player video{width:1080px;height:1920px;object-fit:cover;display:block;background:#000}

/* Back is kept and stays tappable, but is never drawn: the top-left
   corner of the video is an invisible exit target. Esc works too. */
#exit{
  position:absolute;left:0;top:0;
  width:280px;height:220px;
  margin:0;padding:0;border:0;background:none;
  -webkit-appearance:none;appearance:none;
  opacity:0;cursor:pointer;
}
#exit svg{display:none}

#bar{position:absolute;left:0;right:0;bottom:0;height:8px;background:rgba(255,255,255,.16)}
#bar i{display:block;height:100%;width:0;background:#fff;transition:width .2s linear}

/* ---------- branded loading surface ---------- */
#loader{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-bottom:56px;
  background:var(--sky);
  opacity:0;visibility:hidden;
  transition:opacity .34s ease, visibility 0s linear .34s;
}
#player.booting #loader,
#player.failed  #loader{
  opacity:1;visibility:visible;
  transition:opacity .18s ease;
}

#ldLogo{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{
  0%,100%{transform:scale(1);opacity:1}
  50%    {transform:scale(1.035);opacity:.88}
}

#ldName{
  margin-top:52px;
  font-size:38px;font-weight:500;letter-spacing:.2px;color:var(--navy);
}

#ldBar{
  margin-top:44px;width:320px;height:9px;border-radius:5px;overflow:hidden;
  background:rgba(27,84,168,.15);
}
#ldBar i{
  display:block;width:38%;height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--bc-blue),var(--bc-orange));
  animation:sweep 1.35s cubic-bezier(.62,.02,.35,1) infinite;
}
@keyframes sweep{
  0%  {transform:translateX(-100%)}
  100%{transform:translateX(263%)}
}
#player.failed #ldBar,
#player.needstap #ldBar{display:none}

#ldTap{
  display:none;margin-top:40px;align-items:center;gap:20px;
  padding:0 34px 0 22px;height:88px;border:0;border-radius:44px;cursor:pointer;
  font:inherit;font-size:30px;font-weight:500;letter-spacing:.2px;color:#fff;
  background:var(--bc-blue);
  box-shadow:0 10px 26px -10px rgba(27,84,168,.75);
}
#ldTap svg{display:block}
#player.needstap #ldTap{display:flex}

/* mid-playback buffering: a small ring over the video, never the full surface */
#buf{
  position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;
  border:5px solid rgba(255,255,255,.26);border-top-color:var(--bc-orange);
  border-radius:50%;animation:sp .95s linear infinite;
  opacity:0;transition:opacity .2s ease;
}
#player.loading:not(.booting) #buf{opacity:1}
@keyframes sp{to{transform:rotate(360deg)}}

#err{
  display:none;text-align:center;color:var(--navy);
  margin-top:44px;max-width:820px;
}
#player.failed #err{display:block}
#err h2{font-size:40px;font-weight:700;margin-bottom:16px}
#err p{
  font-size:23px;line-height:34px;color:#5D6C86;word-break:break-all;
  font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;
}

/* no progress bar over the branded surface */
#player.booting #bar,
#player.failed  #bar{opacity:0}
</style>

<script>
/* ============================================================
   CONFIG — Supabase Storage
   Bucket "npci" is public, so plain public URLs are used.
   Set PUBLIC = false (and supply an anon key) to use signed URLs.
   ============================================================ */
const SUPABASE_URL = "https://ozkbnimjuhaweigscdby.supabase.co";
const BUCKET       = "npci";
const FOLDER       = "bh_videos";
const PUBLIC       = true;
const SUPABASE_KEY = "";   /* only needed when PUBLIC === false */

/* ---- category -> video object in bh_videos/ ---- */
const CATEGORIES = [
  { id:"education",   label:"Education\nFees",  file:"education.mp4"   },
  { id:"electricity", label:"Electricity",      file:"electricity.mp4" },
  { id:"echallan",    label:"E-challan",        file:"e-challan.mp4"   },
  { id:"loan",        label:"Loan\nrepayment",  file:"loan.mp4"        },
  { id:"fastag",      label:"FASTag",           file:"fastag.mp4"      },
  { id:"lpg",         label:"LPG",              file:"lpg.mp4"         },
  { id:"nps",         label:"NPS",              file:"ncmc.mp4"        },
  { id:"pipedgas",    label:"Piped gas",        file:"piped-gas.mp4"   },
  { id:"ev",          label:"EV Recharge",      file:"ev-recharge.mp4" },
  { id:"forex",       label:"Forex",            file:"forex.mp4"       }
];

const publicUrl = f =>
  SUPABASE_URL + "/storage/v1/object/public/" + BUCKET + "/" + FOLDER + "/" + encodeURIComponent(f);

async function signedUrl(f){
  const r = await fetch(SUPABASE_URL + "/storage/v1/object/sign/" + BUCKET + "/" + FOLDER + "/" + encodeURIComponent(f), {
    method:"POST",
    headers:{ "Content-Type":"application/json", apikey:SUPABASE_KEY, Authorization:"Bearer " + SUPABASE_KEY },
    body: JSON.stringify({ expiresIn: 3600 })
  });
  if(!r.ok) throw new Error("sign failed " + r.status);
  const j = await r.json();
  return SUPABASE_URL + "/storage/v1" + j.signedURL;
}

const videoUrl = f => PUBLIC ? Promise.resolve(publicUrl(f)) : signedUrl(f);
</script>

<script>
/* ============================================================
   BUILD GRID
   ============================================================ */
const grid = document.getElementById("grid");

CATEGORIES.forEach(function(c){
  const b = document.createElement("button");
  b.type = "button";
  b.className = "tile";
  b.setAttribute("role","listitem");
  b.dataset.file = c.file;
  b.innerHTML =
    '<span class="ic">' + ICONS[c.id] + '</span>' +
    '<span class="tx">' + c.label.replace("\n","<br>") + '</span>';
  b.addEventListener("click", function(){ play(c); });
  grid.appendChild(b);
});

/* ============================================================
   PLAYER
   ============================================================ */
const player = document.getElementById("player");
const vid    = document.getElementById("vid");
const barIn  = document.querySelector("#bar i");
const errU   = document.getElementById("errU");
const ldName = document.getElementById("ldName");

function play(c){
  player.classList.add("on","booting","loading");
  player.classList.remove("failed","needstap");
  player.setAttribute("aria-hidden","false");
  ldName.textContent = c.label.replace("\n"," ");
  barIn.style.width = "0%";

  errU.textContent = FOLDER + "/" + c.file;

  /* Public URLs are built synchronously so vid.play() still runs inside the
     tap's user-activation window; signing needs a round trip, so that path
     may fall back to the tap-to-play button. */
  if(PUBLIC){
    start(publicUrl(c.file));
  } else {
    signedUrl(c.file).then(start).catch(function(e){ fail(c.file, e && e.message); });
  }
}

function start(url){
  vid.src = url;
  vid.currentTime = 0;
  var pr = vid.play();
  if(pr && pr.catch) pr.catch(function(e){
    /* Blocked autoplay is not a broken video - offer a tap instead.
       Genuine load failures arrive on the element's own "error" event. */
    if(e && e.name === "NotAllowedError"){
      if(!player.classList.contains("failed")) player.classList.add("needstap");
    }
  });
}

function fail(file, msg){
  player.classList.remove("loading","booting","needstap");
  player.classList.add("failed");
  errU.textContent = FOLDER + "/" + file + (msg ? " — " + msg : "");
}

function stop(){
  vid.pause();
  vid.removeAttribute("src");
  vid.load();
  player.classList.remove("on","booting","loading","failed","needstap");
  player.setAttribute("aria-hidden","true");
}

vid.addEventListener("playing", function(){ player.classList.remove("loading","booting","needstap"); });
vid.addEventListener("waiting", function(){ player.classList.add("loading"); });
vid.addEventListener("error",   function(){
  if(vid.getAttribute("src")) fail(decodeURIComponent(vid.src.split("/").pop()), "load error");
});
vid.addEventListener("ended", stop);
vid.addEventListener("timeupdate", function(){
  if(vid.duration) barIn.style.width = (vid.currentTime / vid.duration * 100) + "%";
});

document.getElementById("ldTap").addEventListener("click", function(e){
  e.stopPropagation();
  player.classList.remove("needstap");
  vid.play().catch(function(){ player.classList.add("needstap"); });
});
document.getElementById("exit").addEventListener("click", stop);
document.getElementById("back").addEventListener("click", stop);
player.addEventListener("pointerdown", function(e){
  if(e.target.closest("#exit") || e.target.closest("#ldTap")) return;
  /* the error surface carries no visible control, so any tap on it exits */
  if(player.classList.contains("failed")){ stop(); return; }
  if(vid.paused && vid.getAttribute("src")) vid.play().catch(function(){});
});
addEventListener("keydown", function(e){
  if(e.key === "Escape" || e.key === "Backspace") stop();
});

/* ============================================================
   FIT THE 1080x1920 STAGE TO THE VIEWPORT
   ============================================================ */
const stage = document.getElementById("stage");
function fit(){
  const s = Math.min(innerWidth / 1080, innerHeight / 1920);
  stage.style.transform = "translate(-50%,-50%) scale(" + s + ")";
}
addEventListener("resize", fit);
addEventListener("orientationchange", fit);
fit();
</script>
</body>
</html>
